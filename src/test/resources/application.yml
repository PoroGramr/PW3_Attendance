external:
  imgbb:
    api:
      key: test-dummy-imgbb-key

GEMINI_API_KEY: test-dummy-gemini-key

spring:
  datasource:
    url: jdbc:h2:mem:pw3-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    openai:
      api-key: test-dummy-gemini-key
  mail:
    host: localhost
    port: 3025
    username: test@example.com
    password: test-password

app:
  qr-url-base: http://localhost:8080
  jwt:
    secret: dGVzdC1qd3Qtc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMzItYnl0ZXM=
    access-token-validity: 15m
    refresh-token-validity: 14d
    issuer: pw3-attendant-test
  minio:
    endpoint: http://localhost:9000
    access-key: test-minio-access-key
    secret-key: test-minio-secret-key
    bucket: test-face-images
    presigned-url-validity: 10m
  account-recovery:
    code-validity: 10m
    resend-interval: 1m
    max-attempts: 5
    mail-from: test@example.com
  acts29:
    user-id: test@example.com
    password: test-password
    base-url: https://acts29.example.test/child_ecare
    headless: true
    browser-channel: ""
    timeout: 5s

coolsms:
  api:
    key: test-key
    secret: test-secret
    number: "01000000000"

discord:
