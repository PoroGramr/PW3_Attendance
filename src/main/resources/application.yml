spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  ai:
    openai:
      api-key: ${GEMINI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        options:
          model: gemini-1.5-flash
          temperature: 0.3

app:
  qr-url-base: ${QR_URL_BASE}
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:15m}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:14d}
    issuer: ${JWT_ISSUER:pw3-attendant}
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:pw3-face-images}
    presigned-url-validity: ${MINIO_PRESIGNED_URL_VALIDITY:10m}

coolsms:
  api:
    key: ${COOLSMS_API_KEY}
    secret: ${COOLSMS_SECRET_KEY}
    number: ${COOLSMS_SENDER_NUMBER}

external:
  imgbb:
    api:
      key: ${IMGBB_API_KEY}

server:
  forward-headers-strategy: framework

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}
