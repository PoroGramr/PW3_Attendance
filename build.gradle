plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jspark'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'com.microsoft.playwright:playwright:1.63.0'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'mysql:mysql-connector-java:8.0.33'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'io.minio:minio:9.0.1'
    implementation 'net.nurigo:sdk:4.3.2'
    	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
        implementation 'io.projectreactor:reactor-core' // org.reactivestreams.Publisher를 제공
        compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    
    // Spring AI - OpenAI (Gemini 호환)
    implementation('org.springframework.ai:spring-ai-openai-spring-boot-starter:1.0.0-M5') {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('generateAdminPasswordHash', JavaExec) {
	group = 'application'
	description = 'Generates a BCrypt hash from the ADMIN_PASSWORD environment variable.'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.jspark.pw3_attendant.tools.BCryptPasswordGenerator'
}
