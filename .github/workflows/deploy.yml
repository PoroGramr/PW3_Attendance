name: Deploy PW3 to home server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pw3-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'PoroGramr/PW3_Attendance'
    runs-on: [self-hosted, Linux, X64, pw3-deploy]
    timeout-minutes: 30
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Deploy and verify
        run: bash scripts/deploy-production.sh
